services:
  qvoicecloning:
    build: .
    container_name: qvoicecloning-service
    ports:
      - "8001:8001"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COQUI_TOS_AGREED=1
    volumes:
      - ./voices:/app/voices
      - ./output:/app/output
      - ./models:/root/.local/share/tts
    # Caso possua placa de vídeo NVIDIA dedicada no host, descomente o bloco deploy abaixo:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
